<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="知らなかった熟語や単語を、ランダムな四択問題で学ぶ語彙クイズです。">
  <title>語彙クイズ</title>
  <style>
:root {
  color-scheme: light dark;
  --bg: #f4f6f8;
  --panel: rgba(255, 255, 255, 0.92);
  --text: #17202a;
  --muted: #65717d;
  --line: #dfe5ea;
  --accent: #315f86;
  --accent-strong: #204767;
  --accent-soft: #e8f0f6;
  --success: #217a55;
  --success-soft: #e7f5ee;
  --danger: #a33d3d;
  --danger-soft: #f9eaea;
  --shadow: 0 18px 50px rgba(23, 32, 42, 0.08);
  --radius: 22px;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at top left, rgba(49,95,134,.12), transparent 35%),
    var(--bg);
}
button { font: inherit; }
button:focus-visible { outline: 3px solid rgba(49,95,134,.28); outline-offset: 3px; }
.hidden { display: none !important; }
.app-shell { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 34px 0 56px; }
.site-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 26px; }
h1, h2, h3, p { margin-top: 0; }
h1 { margin-bottom: 0; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: .03em; }
.eyebrow { margin-bottom: 7px; color: var(--accent); font-weight: 800; font-size: .72rem; letter-spacing: .17em; }
.panel { background: var(--panel); border: 1px solid rgba(255,255,255,.65); border-radius: var(--radius); box-shadow: var(--shadow); }
.screen { animation: enter .28s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(7px); } }
.hero { padding: clamp(28px, 6vw, 54px); text-align: center; }
.hero h2 { font-size: clamp(1.7rem, 5vw, 2.8rem); margin-bottom: 16px; }
.hero p:not(.hero-kicker) { max-width: 640px; margin: 0 auto 28px; color: var(--muted); line-height: 1.9; }
.hero-kicker { color: var(--accent); font-weight: 800; letter-spacing: .1em; }
.primary-button, .secondary-button, .text-button { cursor: pointer; border: 0; border-radius: 14px; font-weight: 800; }
.primary-button { padding: 14px 24px; color: #fff; background: var(--accent); box-shadow: 0 10px 24px rgba(49,95,134,.22); }
.primary-button:hover { background: var(--accent-strong); transform: translateY(-1px); }
.secondary-button { padding: 14px 20px; color: var(--accent); background: var(--accent-soft); }
.text-button { color: var(--muted); background: transparent; padding: 10px; }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 18px; }
.stat-card { padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; }
.stat-card span { display: block; color: var(--muted); font-size: .82rem; margin-bottom: 7px; }
.stat-card strong { font-size: 1.45rem; }
.quiz-topline { display: flex; justify-content: space-between; color: var(--muted); font-weight: 800; margin-bottom: 10px; }
.progress-track { height: 8px; overflow: hidden; border-radius: 999px; background: var(--line); margin-bottom: 18px; }
#progress-bar { height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
.quiz-card { padding: clamp(24px, 5vw, 42px); }
.question-meta { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
.badge { display: inline-flex; padding: 7px 11px; border-radius: 999px; color: var(--accent); background: var(--accent-soft); font-weight: 800; font-size: .78rem; }
.category-label { color: var(--muted); font-size: .85rem; }
.question-prompt { color: var(--muted); text-align: center; margin: 30px 0 10px; }
.question-text { text-align: center; font-size: clamp(1.65rem, 5vw, 2.65rem); line-height: 1.45; margin-bottom: 30px; }
.choices { display: grid; gap: 12px; }
.choice-button { width: 100%; padding: 16px 18px; text-align: left; border: 1px solid var(--line); border-radius: 15px; color: var(--text); background: transparent; cursor: pointer; line-height: 1.6; transition: .16s ease; }
.choice-button:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
.choice-button:disabled { cursor: default; }
.choice-button.correct { border-color: var(--success); background: var(--success-soft); }
.choice-button.wrong { border-color: var(--danger); background: var(--danger-soft); }
.choice-number { display: inline-grid; place-items: center; width: 28px; height: 28px; margin-right: 10px; border: 1px solid currentColor; border-radius: 9px; font-weight: 800; }
.feedback { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--line); line-height: 1.8; }
.feedback-title { font-size: 1.18rem; font-weight: 900; }
.feedback-title.correct { color: var(--success); }
.feedback-title.wrong { color: var(--danger); }
.feedback-word { font-weight: 900; margin-bottom: 6px; }
.feedback .primary-button { margin-top: 8px; width: 100%; }
.result-card { padding: clamp(28px, 6vw, 48px); text-align: center; }
.score-circle { width: 150px; height: 150px; display: grid; place-content: center; margin: 26px auto 18px; border: 9px solid var(--accent-soft); border-radius: 50%; }
.score-circle strong { font-size: 3.3rem; line-height: 1; }
.score-circle span { color: var(--muted); }
.result-summary { color: var(--muted); }
.result-meta { display: flex; justify-content: center; gap: 28px; margin: 20px 0 28px; }
.result-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.wrong-list-panel { margin-top: 18px; padding: 26px; }
.wrong-item { padding: 16px 0; border-top: 1px solid var(--line); }
.wrong-item:first-child { border-top: 0; }
.wrong-item strong { display: block; margin-bottom: 5px; }
.wrong-item p { margin-bottom: 0; color: var(--muted); line-height: 1.65; }
#loading-screen, #error-screen { padding: 52px; text-align: center; }
.spinner { width: 35px; height: 35px; border: 4px solid var(--line); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 18px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.note { color: var(--muted); line-height: 1.7; }
@media (max-width: 700px) {
  .app-shell { width: min(100% - 20px, 920px); padding-top: 20px; }
  .site-header { align-items: center; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .result-meta { flex-direction: column; gap: 8px; }
  .result-actions > * { width: 100%; }
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10161c; --panel: rgba(25,34,43,.94); --text: #edf2f5; --muted: #aab4bd;
    --line: #34414c; --accent: #83b4dc; --accent-strong: #a1c9e8; --accent-soft: #203849;
    --success: #72c49f; --success-soft: #193c2d; --danger: #ee9a9a; --danger-soft: #482525;
    --shadow: 0 18px 50px rgba(0,0,0,.25);
  }
  .primary-button { color: #10212d; }
}

  </style>
</head>
<body>
  <main class="app-shell">
    <header class="site-header">
      <div>
        <p class="eyebrow">PERSONAL VOCABULARY TRAINER</p>
        <h1>語彙クイズ</h1>
      </div>
      <button id="reset-history-button" class="text-button" type="button">履歴をリセット</button>
    </header>

    <section id="loading-screen" class="panel screen" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>語彙データを読み込んでいます…</p>
    </section>

    <section id="error-screen" class="panel screen hidden" role="alert">
      <h2>読み込みに失敗しました</h2>
      <p id="error-message"></p>
      <p class="note">ページを再読み込みしてください。改善しない場合はファイルを再取得してください。</p>
    </section>

    <section id="start-screen" class="screen hidden">
      <div class="hero panel">
        <p class="hero-kicker">毎回変わる10問</p>
        <h2>言葉を、使える知識へ。</h2>
        <p>意味・読み・単語を問う四択問題がランダムに出題されます。同じ語は1ゲーム内で重複しません。</p>
        <button id="start-button" class="primary-button" type="button">クイズを始める</button>
      </div>

      <div class="stats-grid" aria-label="学習履歴">
        <article class="stat-card"><span>プレイ回数</span><strong id="total-plays">0</strong></article>
        <article class="stat-card"><span>累計回答数</span><strong id="total-answers">0</strong></article>
        <article class="stat-card"><span>累計正答率</span><strong id="total-accuracy">--</strong></article>
        <article class="stat-card"><span>最終プレイ</span><strong id="last-played">--</strong></article>
      </div>
    </section>

    <section id="quiz-screen" class="screen hidden">
      <div class="quiz-topline">
        <span id="question-progress">第1問 / 10</span>
        <span id="elapsed-time">00:00</span>
      </div>
      <div class="progress-track" aria-hidden="true"><div id="progress-bar"></div></div>

      <article class="panel quiz-card">
        <div class="question-meta">
          <span id="question-type" class="badge">意味問題</span>
          <span id="question-category" class="category-label"></span>
        </div>
        <p id="question-prompt" class="question-prompt"></p>
        <h2 id="question-text" class="question-text"></h2>
        <div id="choices" class="choices" role="group" aria-label="選択肢"></div>

        <div id="feedback" class="feedback hidden" aria-live="polite">
          <p id="feedback-title" class="feedback-title"></p>
          <p id="feedback-word" class="feedback-word"></p>
          <p id="feedback-description"></p>
          <button id="next-button" class="primary-button" type="button">次の問題へ</button>
        </div>
      </article>
    </section>

    <section id="result-screen" class="screen hidden">
      <article class="panel result-card">
        <p class="eyebrow">RESULT</p>
        <h2>今回の結果</h2>
        <div class="score-circle"><strong id="result-score">0</strong><span>/ 10</span></div>
        <p id="result-summary" class="result-summary"></p>
        <div class="result-meta">
          <span>正答率 <strong id="result-accuracy">0%</strong></span>
          <span>所要時間 <strong id="result-time">00:00</strong></span>
        </div>
        <div class="result-actions">
          <button id="retry-wrong-button" class="secondary-button" type="button">間違えた問題だけ復習</button>
          <button id="new-quiz-button" class="primary-button" type="button">新しい10問</button>
        </div>
      </article>

      <section id="wrong-answers-section" class="panel wrong-list-panel">
        <h3>間違えた問題</h3>
        <div id="wrong-answers-list"></div>
      </section>
    </section>
  </main>
  <script>
const EMBEDDED_DATA = {"version":2,"words":[{"id":1,"word":"換骨奪胎","reading":"かんこつだったい","meaning":"先人の表現や着想を取り入れながら、独自の作品に作り変えること。","description":"もとは骨を取り替え、胎を奪うという意味。詩文や芸術の創作について用いられます。","category":"四字熟語"},{"id":2,"word":"諫言","reading":"かんげん","meaning":"目上の人の過ちを指摘し、改めるよう忠告すること。","description":"君主や上司などに、言いにくいことをあえて申し述べる場面で使われます。","category":"漢語"},{"id":3,"word":"下賜される","reading":"かしされる","meaning":"身分の高い人から品物などを与えられる。","description":"天皇や君主などが臣下に物を授けることを表す改まった語です。","category":"歴史・制度"},{"id":4,"word":"女衒","reading":"ぜげん","meaning":"女性を遊郭などに売り渡すことを仲介した者。","description":"近世から近代に用いられた語で、現在は歴史的文脈で見られます。","category":"歴史・制度"},{"id":5,"word":"頽廃","reading":"たいはい","meaning":"健全な気風や道徳が衰え、崩れていくこと。","description":"芸術上のデカダンスを指す場合もあります。","category":"漢語"},{"id":6,"word":"混淆","reading":"こんこう","meaning":"異なるものが入り交じること。","description":"文化・概念・血統など、複数の要素が混ざる場合に使われます。","category":"漢語"},{"id":7,"word":"車夫馬丁","reading":"しゃふばてい","meaning":"車を引く者と馬の世話をする者。転じて身分の低い使用人。","description":"古い社会の職業や階層を表す語です。","category":"歴史・制度"},{"id":8,"word":"言祝がれる","reading":"ことほがれる","meaning":"祝福の言葉を述べられる。めでたいものとして祝われる。","description":"『寿ぐ・言祝ぐ』の受け身形です。","category":"古語"},{"id":9,"word":"此岸","reading":"しがん","meaning":"仏教で、迷いや苦しみのあるこの現世。","description":"悟りの世界である『彼岸』の対語です。","category":"仏教"},{"id":10,"word":"丁々発止","reading":"ちょうちょうはっし","meaning":"激しく刀を打ち合うさま。転じて激論を交わすさま。","description":"互いに一歩も引かず、鋭く応酬する様子を表します。","category":"四字熟語"},{"id":11,"word":"シナバル","reading":"しなばる","meaning":"東南アジア産の竜血樹などから得られる赤色の樹脂。","description":"古くは顔料や薬用などに用いられた『竜血』を指す語です。","category":"植物・物質"},{"id":12,"word":"テレオノミー","reading":"てれおのみー","meaning":"生物の構造や行動が、目的をもつかのように方向づけられている性質。","description":"進化によって形成された機能的な目的性を説明する生物学用語です。","category":"生物学"},{"id":13,"word":"ポプリ","reading":"ぽぷり","meaning":"乾燥させた花や香料を混ぜ、香りを楽しむもの。","description":"室内の芳香や装飾に使われます。","category":"外来語"},{"id":14,"word":"箴言","reading":"しんげん","meaning":"戒めや教訓となる短い言葉。","description":"人生や道徳についての簡潔で含蓄ある言葉を指します。","category":"漢語"},{"id":15,"word":"諱","reading":"いみな","meaning":"生前の本名、または死後に忌んで直接呼ばない名。","description":"特に貴人の実名を敬って避ける文化に関係する語です。","category":"歴史・制度"},{"id":16,"word":"畢竟","reading":"ひっきょう","meaning":"つまるところ。結局。","description":"さまざまに考えた末の結論を示す副詞です。","category":"漢語"},{"id":17,"word":"レトロニム","reading":"れとろにむ","meaning":"新しいものの登場後、従来のものを区別するため後から付けられた名称。","description":"例として『固定電話』『紙の本』などが挙げられます。","category":"言語"},{"id":18,"word":"歯の根が合わない","reading":"はのねがあわない","meaning":"寒さや恐怖のため、歯ががちがち鳴る。","description":"ひどく震えている状態を表す慣用句です。","category":"慣用句"},{"id":19,"word":"レジリン","reading":"れじりん","meaning":"昆虫の関節などにある、非常に弾力性の高いタンパク質。","description":"ノミの跳躍や昆虫の羽ばたきに関わります。","category":"生物学"},{"id":20,"word":"擾乱","reading":"じょうらん","meaning":"秩序ある状態をかき乱すこと。また、その乱れ。","description":"物理学や気象学では、系に加わる小さな乱れも指します。","category":"科学"},{"id":21,"word":"久遠","reading":"くおん","meaning":"非常に長く、果てしない時間。","description":"仏教語として永遠に近い時間を表します。","category":"仏教"},{"id":22,"word":"圃場","reading":"ほじょう","meaning":"作物を栽培する田畑や農地。","description":"農業試験や生産管理でよく使われる語です。","category":"農業"},{"id":23,"word":"赫々たる","reading":"かくかくたる","meaning":"光り輝くさま。また、功績や名声がきわめて盛んなさま。","description":"『赫々たる戦果』のように、目覚ましい成果にも使います。","category":"漢語"},{"id":24,"word":"託宣","reading":"たくせん","meaning":"神が人を通して告げる言葉。神のお告げ。","description":"巫女や神官などを介して示される神意を指します。","category":"宗教・神話"},{"id":25,"word":"アンビバレント","reading":"あんびばれんと","meaning":"同じ対象に相反する感情を同時に抱いているさま。","description":"愛情と憎しみなど、両価的な心理状態を表します。","category":"心理"},{"id":26,"word":"他山の石","reading":"たざんのいし","meaning":"他人の誤りや未熟な言動も、自分を磨く参考になるということ。","description":"本来は質の悪い石でも自分の玉を磨ける、というたとえです。","category":"故事成語"},{"id":27,"word":"馬勒","reading":"ばろく","meaning":"馬の頭部につけ、手綱で制御するための馬具。","description":"くつわや面懸などを含む装具を指します。","category":"馬術"},{"id":28,"word":"唯唯諾々","reading":"いいだくだく","meaning":"他人の言うことに何でも従い、少しも逆らわないさま。","description":"主体性なく承諾を重ねる様子を、批判的に表します。","category":"四字熟語"},{"id":29,"word":"橋頭堡","reading":"きょうとうほ","meaning":"敵地に進出するため、橋のたもとなどに築く拠点。転じて活動拡大の足がかり。","description":"軍事用語から転じ、事業や市場進出の拠点にも使われます。","category":"軍事"},{"id":30,"word":"陰府","reading":"いんぷ","meaning":"死者の魂が行くとされる地下の世界。冥府。","description":"中国思想や古典的な表現で、あの世を指します。","category":"宗教・神話"},{"id":31,"word":"居丈高","reading":"いたけだか","meaning":"威圧するような態度をとるさま。","description":"相手を見下し、強く押さえつけるような言動を表します。","category":"形容表現"},{"id":32,"word":"開鑿","reading":"かいさく","meaning":"山や地面を切り開き、運河・トンネル・道路などを造ること。","description":"土木工事で土地を掘り開く意味の語です。","category":"土木"},{"id":33,"word":"等閑に付す","reading":"とうかんにふす","meaning":"物事を軽く見て、いい加減に扱う。","description":"重要なことをなおざりにする意味です。","category":"慣用句"},{"id":34,"word":"掣肘を加える","reading":"せいちゅうをくわえる","meaning":"他人の行動を妨げ、自由にできないようにする。","description":"ひじを引っ張るという意味から、干渉や制約を表します。","category":"慣用句"},{"id":35,"word":"メガデス","reading":"めがです","meaning":"百万人の死者数を一単位として表す語。","description":"核戦争など大規模な人的被害を論じる文脈で使われます。","category":"軍事"},{"id":36,"word":"滔々","reading":"とうとう","meaning":"水が勢いよく流れるさま。また、よどみなく話し続けるさま。","description":"流れや弁舌が盛んな様子を表します。","category":"副詞・形容表現"},{"id":37,"word":"扼する","reading":"やくする","meaning":"強く押さえる。特に、重要な場所を占めて支配する。","description":"『要衝を扼する』のように、交通や軍事の要所を押さえる意味で使います。","category":"漢語"},{"id":38,"word":"屍山血河","reading":"しざんけつが","meaning":"死体が山をなし、血が川となるほどの凄惨な戦場。","description":"非常に多くの死傷者が出た惨状を誇張的に表す四字熟語です。","category":"四字熟語"},{"id":39,"word":"含意","reading":"がんい","meaning":"表面には明示されていないが、言葉や事柄の中に含まれる意味。","description":"論理学・言語学では、ある表現から読み取れる内容を指します。","category":"言語"},{"id":40,"word":"十六夜","reading":"いざよい","meaning":"陰暦十六日の夜。また、その夜の月。","description":"満月より少し遅れて月が出ることを、ためらう意味の『いざよう』に重ねた語です。","category":"季語・暦"},{"id":41,"word":"武運長久","reading":"ぶうんちょうきゅう","meaning":"戦いでの幸運が長く続くことを祈る言葉。","description":"出征する人や武人の無事と勝利を願う表現です。","category":"四字熟語"},{"id":42,"word":"宮仕え","reading":"みやづかえ","meaning":"宮中や貴人のもとに仕えること。転じて組織に勤めること。","description":"現代では会社勤めをやや古風に表すこともあります。","category":"古語"},{"id":43,"word":"惹句","reading":"じゃっく","meaning":"人の注意や興味を引くための短い宣伝文句。","description":"広告のキャッチコピーに当たる語です。","category":"言語"},{"id":44,"word":"韜晦","reading":"とうかい","meaning":"自分の才能・地位・本心などを隠して表に出さないこと。","description":"照れ隠しや意図的な自己隠蔽を表す場合があります。","category":"漢語"},{"id":45,"word":"クリシ ":"漢語"},{"id":60,"word":"アルターエゴ","reading":"あるたーえご","meaning":"もう一人の自分。別人格。また、非常に親密な分身的存在。","description":"ラテン語で『別の私』を意味します。","category":"心理・文学"},{"id":61,"word":"抒情","reading":"じょじょう","meaning":"自分の感情や情緒を表現すること。","description":"詩歌や音楽で、内面的な感情をうたう性質を指します。","category":"文学"},{"id":62,"word":"鰭脚類","reading":"ききゃくるい","meaning":"アザラシ・アシカ・セイウチなど、ひれ状の四肢をもつ海生哺乳類の一群。","description":"分類上の扱いは変化していますが、形態的なまとまりを示す呼称として使われます。","category":"生物学"},{"id":63,"word":"アポトーシス","reading":"あぽとーしす","meaning":"細胞が遺伝的な仕組みに従って自ら死ぬ、制御された細胞死。","description":"発生や組織の恒常性維持に重要で、『プログラム細胞死』とも呼ばれます。","category":"生物学"},{"id":64,"word":"テヅルモヅル","reading":"てづるもづる","meaning":"細かく枝分かれした腕をもつ、クモヒトデの仲間。","description":"深海などに生息し、籠のように複雑な腕を広げて餌を捕らえます。","category":"生物学"},{"id":65,"word":"残夢","reading":"ざんむ","meaning":"目覚めた後にも残っている夢の感覚。また、過ぎ去った夢の名残。","description":"詩的・文学的な表現として用いられます。","category":"文学"},{"id":66,"word":"法悦","reading":"ほうえつ","meaning":"仏法を聞いたり悟りに触れたりして得る深い喜び。","description":"宗教的な恍惚や精神的歓喜を表します。","category":"仏教"},{"id":67,"word":"空疎","reading":"くうそ","meaning":"内容や実質が乏しく、むなしいこと。","description":"『空疎な議論』のように、見かけだけで中身がないものを評します。","category":"漢語"},{"id":68,"word":"通奏低音","reading":"つうそうていおん","meaning":"バロック音楽で曲全体を支える低音声部。転じて、物事の底に一貫して流れる要素。","description":"比喩では、作品や時代を貫く基調・背景を指します。","category":"音楽"},{"id":69,"word":"エントロピー","reading":"えんとろぴー","meaning":"熱力学では系の乱雑さやエネルギーの散らばりを表す状態量。","description":"情報理論では不確実性の尺度としても使われます。","category":"物理学"},{"id":70,"word":"産土神","reading":"うぶすながみ","meaning":"その人が生まれた土地を守護する神。","description":"氏神・鎮守神と近い概念ですが、出生地との結びつきを重視します。","category":"神道"},{"id":71,"word":"コンコルド効果","reading":"こんこるどこうか","meaning":"すでに費やした費用や労力を惜しみ、損だと分かっていても継続する心理。","description":"経済学ではサンクコスト効果と呼ばれます。","category":"心理・経済"},{"id":72,"word":"寡聞","reading":"かぶん","meaning":"見聞が狭く、知識が少ないこと。","description":"『寡聞にして存じません』のように、自分をへりくだって使います。","category":"漢語"},{"id":73,"word":"膾炙","reading":"かいしゃ","meaning":"広く世間の人々に知られ、もてはやされること。","description":"『人口に膾炙する』という形でよく使われます。","category":"漢語"},{"id":74,"word":"弥縫策","reading":"び g":"14日間、二週間。","description":"英語 fortnight。ゲーム名とは別に、期間を表す一般語です。","category":"英語"},{"id":161,"word":"花押","reading":"かおう","meaning":"署名の代わりに用いる、名を図案化した独特の記号。","description":"日本では武将・公家・僧侶などが文書に記しました。","category":"歴史"},{"id":162,"word":"詮議","reading":"せんぎ","meaning":"詳しく調べて論じること。特に、取り調べや評議。","description":"「詮議する」「詮議を尽くす」のように使います。","category":"漢語"},{"id":163,"word":"慄然","reading":"りつぜん","meaning":"恐ろしさでぞっとするさま。","description":"身震いするほどの恐怖を表します。","category":"漢語"},{"id":164,"word":"瞞着","reading":"まんちゃく","meaning":"人の目をごまかし、だますこと。","description":"事実を隠して欺く行為を表します。","category":"漢語"},{"id":165,"word":"ショーファーカー","reading":"しょーふぁーかー","meaning":"運転手が運転し、後席に所有者や乗客を乗せることを前提とした高級車。","description":"chauffeur-driven car の意で、後席の快適性を重視します。","category":"自動車"},{"id":166,"word":"ドラマツルギー","reading":"どらまつるぎー","meaning":"演劇の作劇法・構成法。また、社会学では日常行為を舞台上の演技として捉える視点。","description":"ドイツ語 Dramaturgie に由来します。","category":"演劇・社会学"},{"id":167,"word":"フォン","reading":"ふぉん","meaning":"ドイツ語圏の姓で、歴史的に出身地や貴族身分を示すことがある前置詞。","description":"英語の of に相当しますが、現代では必ずしも貴族を意味しません。","category":"言語・歴史"},{"id":168,"word":"エクウス","reading":"えくうす","meaning":"ウマ、ロバ、シマウマなどを含むウマ属の学名。","description":"ラテン語で馬を意味します。現生のウマ科で唯一の属です。","category":"生物"},{"id":169,"word":"金科玉条","reading":"きんかぎょくじょう","meaning":"最も大切で、絶対に守るべき規則や教え。","description":"もとは黄金や玉のように尊い法律・条文という意味です。","category":"四字熟語"},{"id":170,"word":"牽強付会","reading":"けんきょうふかい","meaning":"道理に合わないことを無理にこじつけ、自説に都合よく説明すること。","description":"根拠の薄い関連づけを批判する語です。","category":"四字熟語"},{"id":171,"word":"顧慮","reading":"こりょ","meaning":"周囲の事情や相手の立場を考えに入れること。気にかけること。","description":"「安全に顧慮する」のように使います。","category":"漢語"},{"id":172,"word":"独立不羈","reading":"どくりつふき","meaning":"他から支配・束縛されず、自分の信念に従って行動すること。","description":"「不羈」は束縛されないことです。","category":"四字熟語"},{"id":173,"word":"截然","reading":"せつぜん","meaning":"区切りや違いがはっきりしているさま。","description":"「両者は截然と異なる」のように使います。","category":"漢語"}]};
const STORAGE_KEY = "vocabularyQuizStatsV1";
const QUESTION_COUNT = 10;

const $ = (selector) => document.querySelector(selector);
const screens = ["#loading-screen", "#error-screen", "#start-screen", "#quiz-screen", "#result-screen"];
let words = [];
let quiz = [];
let currentIndex = 0;
let score = 0;
let mistakes = [];
let answered = false;
let startedAt = 0;
let timerId = null;

const emptyStats = () => ({ plays: 0, answers: 0, correct: 0, lastPlayed: null, perWord: {} });


function normalizeWordKey(value) {
  const aliases = new Map([
    ["易々諾々", "唯唯諾々"],
    ["膾炙する", "膾炙"],
    ["惹句", "惹句"],
    ["吝嗇", "吝嗇"],
    ["アポトーシス", "アポトーシス"],
    ["韜晦", "韜晦"]
  ]);
  let key = String(value ?? "")
    .normalize("NFKC")
    .trim()
    .replace(/[\s・･\-‐‑–—―_（）()「」『』【】\[\]、,。.]/g, "");
  for (const suffix of ["する", "される", "を加える", "を排して", "を払い"]) {
    if (key.endsWith(suffix)) key = key.slice(0, -suffix.length);
  }
  return aliases.get(key) ?? key;
}

function deduplicateWords(items) {
  const seen = new Set();
  return items.filter((item) => {
    const key = normalizeWordKey(item.word);
    if (!key || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function showScreen(id) {
  screens.forEach((screen) => $(screen).classList.toggle("hidden", screen !== id));
}
function shuffle(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}
function loadStats() {
  try { return { ...emptyStats(), ...JSON.parse(localStorage.getItem(STORAGE_KEY)) }; }
  catch { return emptyStats(); }
}
function saveStats(stats) { localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); }
function formatTime(seconds) {
  const min = String(Math.floor(seconds / 60)).padStart(2, "0");
  const sec = String(seconds % 60).padStart(2, "0");
  return `${min}:${sec}`;
}
function elapsedSeconds() { return Math.floor((Date.now() - startedAt) / 1000); }
function renderStats() {
  const stats = loadStats();
  $("#total-plays").textContent = stats.plays;
  $("#total-answers").textContent = stats.answers;
  $("#total-accuracy").textContent = stats.answers ? `${Math.round(stats.correct / stats.answers * 100)}%` : "--";
  $("#last-played").textContent = stats.lastPlayed ? new Date(stats.lastPlayed).toLocaleDateString("ja-JP") : "--";
}
function distractorsFor(word, field) {
  const sameCategory = words.filter((item) => item.id !== word.id && item.category === word.category);
  const others = words.filter((item) => item.id !== word.id && item.category !== word.category);
  return shuffle([...shuffle(sameCategory), ...shuffle(others)]).slice(0, 3).map((item) => item[field]);
}
function hasKanji(text) {
  return /\p{Script=Han}/u.test(text);
}
function normalizedReading(text) {
  return String(text || "")
    .normalize("NFKC")
    .replace(/[\s・･ー\-]/g, "")
    .toLowerCase();
}
function availableQuizTypes(word) {
  // 将来、語彙データ側で出題形式を明示できるようにする。
  const configured = Array.isArray(word.quizTypes)
    ? word.quizTypes.filter((type) => ["meaning", "word", "reading"].includes(type))
    : null;

  let types = configured?.length ? [...configured] : ["meaning", "word"];

  // 読み問題は漢字を含む語だけに限定する。
  // カタカナ語・ひらがな語・英字語は、表記を読ませるだけになるため除外する。
  const usefulReading = Boolean(
    word.reading &&
    hasKanji(word.word) &&
    normalizedReading(word.word) !== normalizedReading(word.reading)
  );

  if (usefulReading && !types.includes("reading") && !configured) types.push("reading");
  if (!usefulReading) types = types.filter((type) => type !== "reading");
  return types.length ? types : ["meaning", "word"];
}
function buildQuestion(word) {
  const type = shuffle(availableQuizTypes(word))[0];
  if (type === "meaning") {
    return {
      word, type, label: "意味問題", prompt: "次の言葉の意味として最も適切なものは？",
      text: word.word, answer: word.meaning,
      choices: shuffle([word.meaning, ...distractorsFor(word, "meaning")])
    };
  }
  if (type === "reading") {
    return {
      word, type, label: "読み問題", prompt: "次の言葉の読みとして正しいものは？",
      text: word.word, answer: word.reading,
      choices: shuffle([word.reading, ...distractorsFor(word, "reading").filter(Boolean)]).slice(0, 4)
    };
  }
  return {
    word, type, label: "単語問題", prompt: "次の意味に当てはまる言葉は？",
    text: word.meaning, answer: word.word,
    choices: shuffle([word.word, ...distractorsFor(word, "word")])
  };
}
function makeQuiz(sourceWords, count = QUESTION_COUNT) {
  return shuffle(sourceWords).slice(0, Math.min(count, sourceWords.length)).map(buildQuestion);
}
function startQuiz(sourceWords = words, count = QUESTION_COUNT) {
  quiz = makeQuiz(sourceWords, count);
  currentIndex = 0; score = 0; mistakes = []; answered = false; startedAt = Date.now();
  clearInterval(timerId);
  timerId = setInterval(() => $("#elapsed-time").textContent = formatTime(elapsedSeconds()), 1000);
  showScreen("#quiz-screen");
  renderQuestion();
}
function renderQuestion() {
  answered = false;
  const question = quiz[currentIndex];
  $("#question-progress").textContent = `第${currentIndex + 1}問 / ${quiz.length}`;
  $("#progress-bar").style.width = `${currentIndex / quiz.length * 100}%`;
  $("#question-type").textContent = question.label;
  $("#question-category").textContent = question.word.category;
  $("#question-prompt").textContent = question.prompt;
  $("#question-text").textContent = question.text;
  $("#feedback").classList.add("hidden");
  const choices = $("#choices"); choices.innerHTML = "";
  question.choices.forEach((choice, index) => {
    const button = document.createElement("button");
    button.className = "choice-button";
    button.type = "button";
    button.innerHTML = `<span class="choice-number">${index + 1}</span>${choice}`;
    button.addEventListener("click", () => answerQuestion(choice, button));
    choices.appendChild(button);
  });
}
function answerQuestion(choice, button) {
  if (answered) return;
  answered = true;
  const question = quiz[currentIndex];
  const correct = choice === question.answer;
  if (correct) score += 1; else mistakes.push(question);
  document.querySelectorAll(".choice-button").forEach((choiceButton) => {
    choiceButton.disabled = true;
    const text = choiceButton.textContent.replace(/^\d/, "").trim();
    if (text === question.answer) choiceButton.classList.add("correct");
  });
  if (!correct) button.classList.add("wrong");
  const title = $("#feedback-title");
  title.textContent = correct ? "正解です" : "不正解です";
  title.className = `feedback-title ${correct ? "correct" : "wrong"}`;
  $("#feedback-word").textContent = `${question.word.word}${question.word.reading ? `（${question.word.reading}）` : ""}`;
  $("#feedback-description").textContent = question.word.description;
  $("#next-button").textContent = currentIndex === quiz.length - 1 ? "結果を見る" : "次の問題へ";
  $("#feedback").classList.remove("hidden");
  updatePerWord(question.word.id, correct);
}
function updatePerWord(id, correct) {
  const stats = loadStats();
  stats.perWord[id] ||= { correct: 0, wrong: 0 };
  stats.perWord[id][correct ? "correct" : "wrong"] += 1;
  saveStats(stats);
}
function finishQuiz() {
  clearInterval(timerId);
  const seconds = elapsedSeconds();
  const stats = loadStats();
  stats.plays += 1; stats.answers += quiz.length; stats.correct += score; stats.lastPlayed = new Date().toISOString();
  saveStats(stats);
  $("#result-score").textContent = score;
  $("#result-accuracy").textContent = `${Math.round(score / quiz.length * 100)}%`;
  $("#result-time").textContent = formatTime(seconds);
  $("#result-summary").textContent = score === quiz.length ? "全問正解です。見事です。" : score >= 8 ? "よく理解できています。" : score >= 5 ? "復習すると、さらに定着しそうです。" : "間違えた語を解説と一緒に見直しましょう。";
  $("#retry-wrong-button").disabled = mistakes.length === 0;
  const list = $("#wrong-answers-list"); list.innerHTML = "";
  $("#wrong-answers-section").classList.toggle("hidden", mistakes.length === 0);
  mistakes.forEach(({ word }) => {
    const item = document.createElement("article"); item.className = "wrong-item";
    item.innerHTML = `<strong>${word.word}${word.reading ? `（${word.reading}）` : ""}</strong><p>${word.meaning}</p>`;
    list.appendChild(item);
  });
  showScreen("#result-screen"); renderStats();
}
function bindEvents() {
  $("#start-button").addEventListener("click", () => startQuiz());
  $("#new-quiz-button").addEventListener("click", () => startQuiz());
  $("#retry-wrong-button").addEventListener("click", () => startQuiz(mistakes.map((q) => q.word), mistakes.length));
  $("#next-button").addEventListener("click", () => { currentIndex += 1; currentIndex >= quiz.length ? finishQuiz() : renderQuestion(); });
  $("#reset-history-button").addEventListener("click", () => { if (confirm("学習履歴をすべて削除しますか？")) { localStorage.removeItem(STORAGE_KEY); renderStats(); } });
  document.addEventListener("keydown", (event) => {
    if (!$("#quiz-screen").classList.contains("hidden") && !answered && ["1","2","3","4"].includes(event.key)) {
      document.querySelectorAll(".choice-button")[Number(event.key) - 1]?.click();
    } else if (!$("#quiz-screen").classList.contains("hidden") && answered && event.key === "Enter") $("#next-button").click();
  });
}
function init() {
  bindEvents();
  try {
    words = deduplicateWords(EMBEDDED_DATA.words);
    if (!Array.isArray(words) || words.length < 10) throw new Error("語彙データが不足しています。");
    renderStats(); showScreen("#start-screen");
  } catch (error) {
    $("#error-message").textContent = error.message;
    showScreen("#error-screen");
  }
}
init();

  </script>
