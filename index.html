<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Word Vault | 語彙クイズ</title>

<link rel="icon" href="assets/favicon.ico?v=2" type="image/x-icon" sizes="16x16 32x32 48x48">
<link rel="icon" href="assets/favicon-16.png?v=2" type="image/png" sizes="16x16">
<link rel="icon" href="assets/favicon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="assets/word-vault-touch-icon.png?v=2" sizes="180x180">
<link rel="manifest" href="site.webmanifest?v=2">

<meta
    name="description"
    content="苦手な言葉ほど出題されやすい、個人用の語彙学習クイズです。"
>

<meta
    name="theme-color"
    content="#008577"
>

<link rel="stylesheet"
      href="css/style.css?v=11.9.0">
<link id="pixel-ui-stylesheet" rel="stylesheet" href="css/pixel-ui.css?v=11.9.0">
<script src="js/appearance.js?v=11.9.0"></script>

</head>

<body>

<div id="app">

<header class="topbar">

<h1 class="logo">

<img src="assets/word-vault-logo.png" alt="Word Vault" width="2003" height="366">

</h1>

<div id="word-count">

<span class="word-count-label">WORDS</span>
<strong id="word-count-value">0</strong>

</div>

</header>

<main id="view">

<section
class="card home-card">

<h2>

今日のおすすめ

</h2>

<p>

苦手な語を優先して出題します

</p>

<button
id="dailyButton"
class="primary">

今日の5問

</button>

</section>

<section
class="card">

<button
id="startQuiz"
class="menuButton">

クイズ開始

</button>

<button
id="reviewButton"
class="menuButton">

復習ノート

</button>

<button
id="dictionaryButton"
class="menuButton">

語彙一覧

</button>

<button
id="rankingButton"
class="menuButton">

苦手ランキング

</button>

<button
id="statisticsButton"
class="menuButton">

統計

</button>

<button
id="settingsButton"
class="menuButton">

設定

</button>

</section>

<section
class="card stats">

<div class="stat">

<span>

総語彙

</span>

<strong
id="totalWords">

174

</strong>

</div>

<div class="stat">

<span>

習得

</span>

<strong
id="masteredWords">

0

</strong>

</div>

<div class="stat">

<span>

苦手

</span>

<strong
id="weakWords">

0

</strong>

</div>

<div class="stat">

<span>

未出題

</span>

<strong
id="newWords">

174

</strong>

</div>

</section>

</main>

</div>

<script src="js/utils.js?v=9.1.0"></script>

<script src="js/share-format.js?v=10.0.0"></script>

<script src="js/storage.js?v=11.9.0"></script>

<script src="js/cloud-sync.js?v=9.1.3"></script>

<script src="js/router.js?v=9.1.0"></script>

<script src="js/quiz.js?v=11.0.0"></script>

<script src="js/review.js?v=9.1.0"></script>

<script src="js/dictionary.js?v=9.1.1"></script>

<script src="js/statistics.js?v=9.1.0"></script>

<script src="js/settings.js?v=11.9.0"></script>

<script src="js/addWords.js?v=11.5.0"></script>

<script src="js/word-packs.js?v=11.2.0"></script>

<script src="js/pack-preview.js?v=11.1.0"></script>

<script src="js/shared-vocabulary.js?v=10.0.1"></script>

<script src="js/app.js?v=11.9.0"></script>

</body>

<footer class="site-footer">
    Word Vault
    <span id="footerVersion"></span>
</footer>

</html>
